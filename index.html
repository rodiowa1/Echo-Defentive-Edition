<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ECHO 2.0 — Хоррор-игра на выживание</title>
    <meta name="description" content="Убегайте от монстра в лабиринте, используйте импульсы, покупайте классы и предметы. Ежедневные награды, хардкорный режим и секреты!">
    <meta property="og:title" content="ECHO 2.0 — Игра на выживание">
    <meta property="og:description" content="Хоррор-игра с уникальными классами, предметами и ритуалами изгнания. Попробуй выжить!">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://rodiowa1.github.io/Echo-Defentive-Edition/">
    <meta property="og:image" content="https://rodiowa1.github.io/Echo-Defentive-Edition/banner.jpg">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a0a;
            color: #0f0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            background-image: radial-gradient(circle at 20% 30%, #0a1a0a, #000000);
        }
        .container {
            max-width: 820px;
            width: 100%;
            padding: 30px 20px;
            border: 1px solid #0f0;
            box-shadow: 0 0 40px rgba(0,255,0,0.2);
            background: rgba(0,0,0,0.85);
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }
        .banner-svg {
            width: 100%;
            max-height: 220px;
            height: auto;
            display: block;
            margin: 0 auto 10px;
            filter: drop-shadow(0 0 20px rgba(0,255,0,0.3));
        }
        .play-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 15px 0 10px;
        }
        .btn-play {
            display: inline-block;
            padding: 18px 40px;
            background: transparent;
            color: #0f0;
            border: 2px solid #0f0;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(0,255,0,0.2);
            border-radius: 8px;
            cursor: pointer;
            flex: 1 1 auto;
            min-width: 200px;
        }
        .btn-play:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 60px #0f0;
            transform: scale(1.03);
        }
        .btn-play:active { transform: scale(0.97); }
        .btn-play-pc {
            border-color: #0ff;
            color: #0ff;
            box-shadow: 0 0 25px rgba(0,255,255,0.2);
        }
        .btn-play-pc:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 60px #0ff;
        }
        .btn-play-1 {
            border-color: #aaa;
            color: #ddd;
            box-shadow: 0 0 25px rgba(200,200,200,0.15);
            flex-basis: 100%;
        }
        .btn-play-1:hover {
            background: #ddd;
            color: #000;
            box-shadow: 0 0 60px #ddd;
        }
        .btn-play-3 {
            border-color: #ff3cf0;
            color: #ff3cf0;
            box-shadow: 0 0 25px rgba(255,60,240,0.25);
            flex-basis: 100%;
        }
        .btn-play-demo {
            border-color: #ffaa00;
            color: #ffaa00;
            box-shadow: 0 0 25px rgba(255,170,0,0.25);
            flex-basis: 100%;
        }
        .btn-play-demo:hover {
            background: #ffaa00;
            color: #000;
            box-shadow: 0 0 60px #ffaa00;
        }
        .btn-play-3:hover {
            background: #ff3cf0;
            color: #000;
            box-shadow: 0 0 60px #ff3cf0;
        }
        .footer {
            margin-top: 35px;
            font-size: 0.7rem;
            color: #333;
            letter-spacing: 2px;
            border-top: 1px solid #111;
            padding-top: 20px;
        }
        .footer a { color: #0f0; text-decoration: none; }
        @media (max-width: 600px) {
            .banner-svg { max-height: 150px; }
        </style>
</head>
<body>
<div class="container">
    <!-- SVG-баннер -->
    <svg class="banner-svg" viewBox="0 0 380 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="glow">
                <feGaussianBlur stdDeviation="5" result="blur"/>
                <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>
        <circle cx="110" cy="60" r="45" fill="none" stroke="#0f0" stroke-width="6" filter="url(#glow)"/>
        <circle cx="110" cy="60" r="45" fill="#0f0" opacity="0.15"/>
        <text x="180" y="75" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#0f0" text-anchor="start" filter="url(#glow)" letter-spacing="6">Echo</text>
    </svg>

    <!-- Кнопки запуска -->
    <div class="play-buttons">
        <a href="Echo-ver1.html" class="btn-play btn-play-1">▶ ИГРАТЬ В ECHO 1.0</a>
        <a href="Echo_new.html" class="btn-play">▶ ИГРАТЬ  В ECHO 2.0 (МОБ.)</a>
        <a href="Echo_PC.html" class="btn-play btn-play-pc">▶ ИГРАТЬ В ECHO 2.0 (ПК)</a>
        <a href="Echo_3dot0.html" class="btn-play btn-play-3">★ ИГРАТЬ В ECHO 3.0 (ПК + МОБ.) ★</a>
        <a href="Echo_demo.html" class="btn-play btn-play-demo">▶ ECHO DEMO</a>
    </div>


    <div class="footer">
        <p>Сделано с ❤️ для смелых • <a href="https://github.com/rodiowa1/Echo-Defentive-Edition" target="_blank">GitHub</a></p>
        <p style="color:#222; font-size:0.6rem;">Внимание: игра содержит яркие вспышки и резкие звуки.</p>
    </div>
</div>

</body>
</html>
